name: Minecraft AFK Bot 247

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */4 * * *' # Restarts every 4 hours to stay active

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install

      - name: Start Bot
        run: node bot-authme-first.js
